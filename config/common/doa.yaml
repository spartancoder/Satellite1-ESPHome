# DOA (Direction of Arrival) Sensor Configuration
# Optional: Include this package in your satellite1.yaml to enable DOA features

# DOA Sensor Component
doa_sensor:
  id: doa_sensor_id
  platform: satellite1

# Text Sensor: MVDR Mode
text_sensor:
  - platform: template
    id: doa_mode
    name: "${friendly_name} DOA Mode"
    entity_category: diagnostic
    icon: mdi:compass
    update_interval: 1s
    lambda: |-
      static std::string last_mode = "";
      uint8_t mode = id(doa_sensor_id)->get_mode();
      switch(mode) {
        case 0: last_mode = "AUTO"; break;
        case 1: last_mode = "FIXED"; break;
        case 2: last_mode = "BROAD"; break;
        default: last_mode = "UNKNOWN"; break;
      }
      return last_mode;

# Sensor: Beam Angle
sensor:
  - platform: template
    id: doa_angle
    name: "${friendly_name} Beam Angle"
    unit_of_measurement: "°"
    icon: mdi:compass
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 1s
    lambda: |-
      return id(doa_sensor_id)->get_angle();

  - platform: template
    id: doa_confidence
    name: "${friendly_name} Beam Confidence"
    unit_of_measurement: "%"
    icon: mdi:signal
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: 1s
    lambda: |-
      return id(doa_sensor_id)->get_confidence();

# Number Control: Set Beam Angle
number:
  - platform: template
    id: doa_set_angle
    name: "${friendly_name} Set Beam Angle"
    unit_of_measurement: "°"
    icon: mdi:angle-acute
    min_value: 0
    max_value: 359
    step: 1
    entity_category: config
    optimistic: true
    set_action:
      - lambda: |-
          id(doa_sensor_id)->set_beam_angle(x);

# Select Control: Set MVDR Mode
select:
  - platform: template
    id: doa_set_mode
    name: "${friendly_name} MVDR Mode"
    icon: mdi:compass
    entity_category: config
    options:
      - "AUTO"
      - "FIXED"
      - "BROAD"
    set_action:
      - lambda: |-
          id(doa_sensor_id)->set_mvdr_mode(x);

