# DOA (Direction of Arrival) Sensor Configuration
# Optional: Include this package in your satellite1.yaml to enable DOA features

# DOA Sensor Component - handles SPI communication and data updates
doa_sensor:
  - platform: satellite1
    id: doa_sensor_id
    # Sensors (automatically updated by DOA component via SPI)
    mode_sensor:
      name: "${friendly_name} DOA Mode"
    angle_sensor:
      name: "${friendly_name} Beam Angle"
    confidence_sensor:
      name: "${friendly_name} Beam Confidence"
    # Controls (send commands to XMOS via SPI)
    angle_number:
      name: "${friendly_name} Set Beam Angle"
      min_value: 0
      max_value: 359
      step: 1
    mode_select:
      name: "${friendly_name} MVDR Mode"
      options:
        - "AUTO"
        - "FIXED"
        - "BROAD"
